<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="642" viewBox="22 18 516 321" role="img" aria-labelledby="plan-ifsi-t"><title id="plan-ifsi-t">Plan de la salle vu de dessus : le patient dans un fauteuil, l'infirmière derrière un bureau, et les quatre places de la caméra.</title><style>.pl-floor { fill: #FCF8EF; stroke: #17130D; stroke-width: 2.6; }
.pl-win { fill: #F5EFE2; stroke: #17130D; stroke-width: 1.2; }
.pl-gap { stroke: #FCF8EF; stroke-width: 4; }
.pl-thin { fill: none; stroke: #17130D; stroke-width: 1.1; }
.pl-dash { stroke-dasharray: 3 4; }
.pl-desk { fill: #EAE2D0; stroke: #17130D; stroke-width: 1.3; }
.pl-obj { fill: #FCF8EF; stroke: #17130D; stroke-width: 1; }
