.pl-seat { fill: #EAE2D0; stroke: #17130D; stroke-width: 1; }
.pl-patient > *, .pl-nurse > * { stroke: #17130D; stroke-width: 1.2; }
.pl-patient .pl-body { fill: #7C7A45; }
